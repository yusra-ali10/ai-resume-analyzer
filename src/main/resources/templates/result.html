<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analysis Result</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f4f6; padding: 32px 16px;
        }
        .wrap { max-width: 760px; margin: 0 auto; }
        h1 { text-align: center; color: #1f2937; margin: 0 0 24px; }
        .score-card {
            background: #fff; border-radius: 20px; padding: 28px;
            text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .ring {
            --c: #ef4444;
            width: 160px; height: 160px; border-radius: 50%;
            margin: 0 auto 12px;
            background: conic-gradient(var(--c) calc(var(--score) * 1%), #e5e7eb 0);
            display: flex; align-items: center; justify-content: center;
        }
        .ring.mid { --c: #f59e0b; }
        .ring.good { --c: #10b981; }
        .ring .inner {
            width: 124px; height: 124px; border-radius: 50%; background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .ring .num { font-size: 40px; font-weight: 700; color: #1f2937; }
        .ring .out { font-size: 13px; color: #6b7280; }
        .label { color: #6b7280; margin: 0; }
        .card {
            background: #fff; border-radius: 16px; padding: 22px 26px;
            margin-bottom: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            border-left: 6px solid #6366f1;
        }
        .card.green { border-left-color: #10b981; }
        .card.red { border-left-color: #ef4444; }
        .card h3 { margin: 0 0 12px; color: #1f2937; }
        .card ul { margin: 0; padding-left: 20px; color: #374151; line-height: 1.7; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background: #fee2e2; color: #b91c1c; padding: 6px 12px;
            border-radius: 999px; font-size: 14px;
        }
        .back {
            display: block; text-align: center; margin-top: 24px;
            padding: 14px; background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff; text-decoration: none; border-radius: 12px; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Analysis Result</h1>

        <div class="score-card">
            <div class="ring"
                 th:classappend="${result.matchScore >= 75 ? 'good' : (result.matchScore >= 50 ? 'mid' : '')}"
                 th:style="'--score:' + ${result.matchScore}">
                <div class="inner">
                    <span class="num" th:text="${result.matchScore}"></span>
                    <span class="out">out of 100</span>
                </div>
            </div>
            <p class="label">Match Score</p>
        </div>

        <div class="card green">
            <h3>Strengths</h3>
            <ul><li th:each="s : ${result.strengths}" th:text="${s}"></li></ul>
        </div>

        <div class="card red">
            <h3>Missing Skills</h3>
            <div class="chips">
                <span class="chip" th:each="m : ${result.missingSkills}" th:text="${m}"></span>
            </div>
        </div>

        <div class="card">
            <h3>Suggestions</h3>
            <ul><li th:each="s : ${result.suggestions}" th:text="${s}"></li></ul>
        </div>

        <a class="back" href="/">Analyze another resume</a>
    </div>
</body>
</html>
